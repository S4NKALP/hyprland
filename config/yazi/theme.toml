[manager]
cwd = { fg = "#b3cad4", bold=true}

hovered         = { fg = "#b8eaff", bg = "#004d61" }
preview_hovered = { underline = true, bold=true }


[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#b8eaff", bg = "#004d61" }

# Mode
mode_normal = { fg = "#003544",   bg = "#88d1ec", bold = true }
mode_select = { fg = "#1e333b", bg = "#b3cad4", bold = true }
mode_unset  = { fg = "#2c2e4d",  bg = "#c3c3eb", bold = true }

[which]
mask            = { bg = "#1b2023" }
cand            = { fg = "#88d1ec" }
desc            = { fg = "#b3cad4" }
separator       = "  "
separator_style = { fg = "#c3c3eb" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b3cad4" },

	# Videos
	{ mime = "video/*", fg = "#c3c3eb" },
	{ mime = "audio/*", fg = "#c3c3eb" },

	# Archives
	{ mime = "application/zip",             fg = "#ffb4ab" },
	{ mime = "application/gzip",            fg = "#ffb4ab" },
	{ mime = "application/x-tar",           fg = "#ffb4ab" },
	{ mime = "application/x-bzip",          fg = "#ffb4ab" },
	{ mime = "application/x-bzip2",         fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/x-rar",           fg = "#ffb4ab" },

	# Fallback
	{ name = "*", fg = "#88d1ec", bold=true },
	{ name = "*/", fg = "#b3cad4", bold=true }
]
