[manager]
cwd = { fg = "#bfc6dc", bold=true}

hovered         = { fg = "#d9e2ff", bg = "#2d4578" }
preview_hovered = { underline = true, bold=true }


[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#d9e2ff", bg = "#2d4578" }

# Mode
mode_normal = { fg = "#142f60",   bg = "#afc6ff", bold = true }
mode_select = { fg = "#293042", bg = "#bfc6dc", bold = true }
mode_unset  = { fg = "#412742",  bg = "#dfbbde", bold = true }

[which]
mask            = { bg = "#1e1f25" }
cand            = { fg = "#afc6ff" }
desc            = { fg = "#bfc6dc" }
separator       = "  "
separator_style = { fg = "#dfbbde" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#bfc6dc" },

	# Videos
	{ mime = "video/*", fg = "#dfbbde" },
	{ mime = "audio/*", fg = "#dfbbde" },

	# Archives
	{ mime = "application/zip",             fg = "#ffb4ab" },
	{ mime = "application/gzip",            fg = "#ffb4ab" },
	{ mime = "application/x-tar",           fg = "#ffb4ab" },
	{ mime = "application/x-bzip",          fg = "#ffb4ab" },
	{ mime = "application/x-bzip2",         fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/x-rar",           fg = "#ffb4ab" },

	# Fallback
	{ name = "*", fg = "#afc6ff", bold=true },
	{ name = "*/", fg = "#bfc6dc", bold=true }
]
