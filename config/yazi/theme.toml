[manager]
cwd = { fg = "#e7beae", bold=true}

hovered         = { fg = "#ffdbcd", bg = "#71361b" }
preview_hovered = { underline = true, bold=true }


[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#ffdbcd", bg = "#71361b" }

# Mode
mode_normal = { fg = "#552107",   bg = "#ffb597", bold = true }
mode_select = { fg = "#442a1f", bg = "#e7beae", bold = true }
mode_unset  = { fg = "#373106",  bg = "#d3c78f", bold = true }

[which]
mask            = { bg = "#271e1a" }
cand            = { fg = "#ffb597" }
desc            = { fg = "#e7beae" }
separator       = "  "
separator_style = { fg = "#d3c78f" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#e7beae" },

	# Videos
	{ mime = "video/*", fg = "#d3c78f" },
	{ mime = "audio/*", fg = "#d3c78f" },

	# Archives
	{ mime = "application/zip",             fg = "#ffb4ab" },
	{ mime = "application/gzip",            fg = "#ffb4ab" },
	{ mime = "application/x-tar",           fg = "#ffb4ab" },
	{ mime = "application/x-bzip",          fg = "#ffb4ab" },
	{ mime = "application/x-bzip2",         fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/x-rar",           fg = "#ffb4ab" },

	# Fallback
	{ name = "*", fg = "#ffb597", bold=true },
	{ name = "*/", fg = "#e7beae", bold=true }
]
