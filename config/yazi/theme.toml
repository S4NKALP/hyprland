[manager]
cwd = { fg = "#b3cad5", bold=true}

hovered         = { fg = "#baeaff", bg = "#004d62" }
preview_hovered = { underline = true, bold=true }


[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#baeaff", bg = "#004d62" }

# Mode
mode_normal = { fg = "#003544",   bg = "#89d0ed", bold = true }
mode_select = { fg = "#1e333c", bg = "#b3cad5", bold = true }
mode_unset  = { fg = "#2d2d4d",  bg = "#c4c3eb", bold = true }

[which]
mask            = { bg = "#1b2023" }
cand            = { fg = "#89d0ed" }
desc            = { fg = "#b3cad5" }
separator       = "  "
separator_style = { fg = "#c4c3eb" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b3cad5" },

	# Videos
	{ mime = "video/*", fg = "#c4c3eb" },
	{ mime = "audio/*", fg = "#c4c3eb" },

	# Archives
	{ mime = "application/zip",             fg = "#ffb4ab" },
	{ mime = "application/gzip",            fg = "#ffb4ab" },
	{ mime = "application/x-tar",           fg = "#ffb4ab" },
	{ mime = "application/x-bzip",          fg = "#ffb4ab" },
	{ mime = "application/x-bzip2",         fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/x-rar",           fg = "#ffb4ab" },

	# Fallback
	{ name = "*", fg = "#89d0ed", bold=true },
	{ name = "*/", fg = "#b3cad5", bold=true }
]
