[manager]
cwd = { fg = "#c4c5dd", bold=true}

hovered         = { fg = "#dfe0ff", bg = "#3b4279" }
preview_hovered = { underline = true, bold=true }


[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#dfe0ff", bg = "#3b4279" }

# Mode
mode_normal = { fg = "#242b61",   bg = "#bcc2ff", bold = true }
mode_select = { fg = "#2d2f42", bg = "#c4c5dd", bold = true }
mode_unset  = { fg = "#45263d",  bg = "#e6bad6", bold = true }

[which]
mask            = { bg = "#1f1f25" }
cand            = { fg = "#bcc2ff" }
desc            = { fg = "#c4c5dd" }
separator       = "  "
separator_style = { fg = "#e6bad6" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#c4c5dd" },

	# Videos
	{ mime = "video/*", fg = "#e6bad6" },
	{ mime = "audio/*", fg = "#e6bad6" },

	# Archives
	{ mime = "application/zip",             fg = "#ffb4ab" },
	{ mime = "application/gzip",            fg = "#ffb4ab" },
	{ mime = "application/x-tar",           fg = "#ffb4ab" },
	{ mime = "application/x-bzip",          fg = "#ffb4ab" },
	{ mime = "application/x-bzip2",         fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/x-rar",           fg = "#ffb4ab" },

	# Fallback
	{ name = "*", fg = "#bcc2ff", bold=true },
	{ name = "*/", fg = "#c4c5dd", bold=true }
]
