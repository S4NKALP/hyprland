[manager]
cwd = { fg = "#bdc7dc", bold=true}

hovered         = { fg = "#d5e3ff", bg = "#234777" }
preview_hovered = { underline = true, bold=true }


[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#d5e3ff", bg = "#234777" }

# Mode
mode_normal = { fg = "#03305f",   bg = "#a6c8ff", bold = true }
mode_select = { fg = "#273141", bg = "#bdc7dc", bold = true }
mode_unset  = { fg = "#3e2845",  bg = "#dbbde2", bold = true }

[which]
mask            = { bg = "#1d2024" }
cand            = { fg = "#a6c8ff" }
desc            = { fg = "#bdc7dc" }
separator       = "  "
separator_style = { fg = "#dbbde2" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#bdc7dc" },

	# Videos
	{ mime = "video/*", fg = "#dbbde2" },
	{ mime = "audio/*", fg = "#dbbde2" },

	# Archives
	{ mime = "application/zip",             fg = "#ffb4ab" },
	{ mime = "application/gzip",            fg = "#ffb4ab" },
	{ mime = "application/x-tar",           fg = "#ffb4ab" },
	{ mime = "application/x-bzip",          fg = "#ffb4ab" },
	{ mime = "application/x-bzip2",         fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/x-rar",           fg = "#ffb4ab" },

	# Fallback
	{ name = "*", fg = "#a6c8ff", bold=true },
	{ name = "*/", fg = "#bdc7dc", bold=true }
]
